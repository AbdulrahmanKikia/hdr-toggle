[package]
name = "hdr_toggle"
version = "0.1.0"
edition = "2021"
description = "System tray utility that toggles HDR on the primary display (Windows 11)"

[dependencies]
anyhow = "=1.0.104"
tao = "=0.37.1"
tray-icon = "=0.26.1"
winreg = "=0.56.0"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security",
]
